name: Validate static platform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout qualified content input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: formal-math-curriculum/content
          ref: 3a1e87c7c55c7b17e9fa7b3eb4deafd8b991e828
          path: .inputs/content
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.23.0
      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache exact dependency store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-24.19.0-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Validate governed M5.6 content contract
        run: node .inputs/content/scripts/validate-m5-6.mjs
      - name: Validate governed M5.8 external snapshot contract
        run: node .inputs/content/scripts/validate-m5-8-snapshots.mjs .inputs/content/source/m5-8/external-snapshot-policy.json .inputs/content/fixtures/m5-8/snapshot-cases.json
      - name: Verify exact third-party license inventory
        run: pnpm licenses:check
      - name: Validate M5.8 release and operations contract
        run: pnpm validate:m5-8-operations
      - name: Build and run integrated M5.5 and M5.6 browser qualification
        run: pnpm build
        env:
          FMC_REQUIRE_BROWSER: '1'
          FMC_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          FMC_RUNNER_IMAGE_LABEL: ubuntu-24.04
      - name: Install frozen M5.9 browser engines
        run: pnpm exec playwright-core install --with-deps chromium firefox webkit
      - name: Execute M5.9 accessibility, responsive, browser and performance qualification
        id: m59-accessibility
        continue-on-error: true
        run: node scripts/validate-m5-9-accessibility-browser.mjs
        env:
          FMC_REQUIRE_BROWSER: '1'
          FMC_M59_CANDIDATE_REVISION: 01c09041aaed77db164a060e6a1aecc889ab861f
          FMC_M59_HARNESS_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          FMC_RUNNER_IMAGE_LABEL: ubuntu-24.04
      - name: Execute M5.9 security and content-integrity qualification
        id: m59-security-integrity
        continue-on-error: true
        run: node scripts/validate-m5-9-security-integrity.mjs
        env:
          FMC_REQUIRE_M59: '1'
          FMC_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          FMC_RUNNER_IMAGE_LABEL: ubuntu-24.04
      - name: Upload immutable M5.9 qualification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: m5-9-qualification-${{ github.sha }}
          path: |
            dist/_validation/m5-9-accessibility-v1
            dist/_validation/m5-9-security-v1
          if-no-files-found: error
          retention-days: 7
      - name: Upload bounded preview artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: site-preview-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
      - name: Enforce M5.9 mandatory qualification outcome
        if: always() && (steps.m59-accessibility.outcome == 'failure' || steps.m59-security-integrity.outcome == 'failure')
        run: |
          echo "M5.9 mandatory qualification failed after evidence upload." >&2
          exit 1
