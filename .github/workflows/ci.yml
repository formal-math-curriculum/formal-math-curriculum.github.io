name: Validate static platform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Checkout qualified content input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: formal-math-curriculum/content
          ref: fb3df63b27ae54d4dc237a421dd241d4c59330e4
          path: .inputs/content
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.23.0
      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache exact dependency store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-24.19.0-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Validate source-owned content contract
        run: node .inputs/content/scripts/validate.mjs .inputs/content/fixtures/minimal/manifest.json
      - name: Build and run integrated M5.5 browser qualification
        run: pnpm build
        env:
          FMC_REQUIRE_BROWSER: '1'
          FMC_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Upload bounded preview artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: site-preview-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
