name: Deploy qualified artifact to Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Checkout qualified content input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: formal-math-curriculum/content
          ref: fb3df63b27ae54d4dc237a421dd241d4c59330e4
          path: .inputs/content
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.23.0
      - run: pnpm install --frozen-lockfile
      - run: node .inputs/content/scripts/validate.mjs .inputs/content/fixtures/minimal/manifest.json
      - run: pnpm build
        env:
          FMC_REQUIRE_BROWSER: '1'
          FMC_SOURCE_REVISION: ${{ github.sha }}
          FMC_RUNNER_IMAGE_LABEL: ubuntu-24.04
      - name: Enforce release authorization and prepare public artifact
        run: node scripts/prepare-release.mjs validation/m5-5-current.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy immutable artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
