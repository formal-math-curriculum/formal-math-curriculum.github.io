name: Deploy qualified artifact to Pages

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FMC_SOURCE_REVISION: ${{ github.sha }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout qualified content input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: formal-math-curriculum/content
          ref: 3a1e87c7c55c7b17e9fa7b3eb4deafd8b991e828
          path: .inputs/content
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.23.0
      - run: pnpm install --frozen-lockfile
      - run: node .inputs/content/scripts/validate-m5-6.mjs
      - run: node .inputs/content/scripts/validate-m5-8-snapshots.mjs .inputs/content/source/m5-8/external-snapshot-policy.json .inputs/content/fixtures/m5-8/snapshot-cases.json
      - run: pnpm licenses:check
      - run: pnpm validate:m5-8-operations
      - name: Validate exact M5.10 release authority
        run: node scripts/validate-m5-10-release.mjs validation/m5-10-current.json
      - run: pnpm build
        env:
          FMC_REQUIRE_BROWSER: '1'
          FMC_SOURCE_REVISION: ${{ github.sha }}
          FMC_RUNNER_IMAGE_LABEL: ubuntu-24.04
      - name: Enforce release authorization and prepare public artifact
        run: node scripts/prepare-release.mjs validation/m5-10-current.json
      - name: Regenerate manifest for the prepared public artifact
        run: node scripts/verify-artifact.mjs
      - name: Package durable release assets
        run: node scripts/package-release.mjs validation/m5-10-current.json
      - name: Verify durable asset checksums
        run: (cd release-assets && sha256sum --check SHA256SUMS)
      - name: Attest public distributable
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/site-dist.tar.zst
      - name: Upload durable release transfer bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: p5-web-v0.1.0-release-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 7
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  release_draft:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download exact durable release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: p5-web-v0.1.0-release-assets
          path: release-assets
      - name: Recheck transfer integrity
        run: (cd release-assets && sha256sum --check SHA256SUMS)
      - name: Bind exact tag and stage immutable release draft before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="p5-web-v0.1.0"
          release_ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$tag\") | .id")"
          release_count="$(sed '/^$/d' <<<"$release_ids" | wc -l)"
          test "$release_count" -le 1

          if tag_revision="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null)"; then
            if test "$tag_revision" != "$GITHUB_SHA"; then
              test "$release_count" -eq 1
              release_id="$release_ids"
              test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.draft')" = "true"
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
                -f sha="$GITHUB_SHA" \
                -F force=true >/dev/null
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

          if test "$release_count" -eq 1; then
            release_id="$release_ids"
            test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.draft')" = "true"
          else
            release_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$tag" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="Formal Mathematics Curriculum 0.1.0" \
              -f body="First bounded, qualified public web-course release. A10 manual assistive-technology execution remains explicitly unavailable under P5-DEC-033; no accessibility-conformance claim is made." \
              -F draft=true \
              --jq '.id')"
          fi

          upload_url="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.upload_url')"
          upload_url="${upload_url%\{*}"
          for asset in site-dist.tar.zst release-tuple.json software-dependencies.json THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.txt SHA256SUMS; do
            asset_ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --jq ".[] | select(.name == \"$asset\") | .id")"
            for asset_id in $asset_ids; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done
            curl --fail-with-body --silent --show-error --location \
              --request POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@release-assets/$asset" \
              "$upload_url?name=$asset" >/dev/null
          done

          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.draft')" = "true"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')" = "$GITHUB_SHA"
          mkdir existing-release-assets
          for asset in site-dist.tar.zst release-tuple.json software-dependencies.json THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.txt SHA256SUMS; do
            asset_ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --jq ".[] | select(.name == \"$asset\") | .id")"
            test "$(sed '/^$/d' <<<"$asset_ids" | wc -l)" -eq 1
            gh api -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_ids" >"existing-release-assets/$asset"
            cmp "release-assets/$asset" "existing-release-assets/$asset"
          done

  deploy:
    needs: release_draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy immutable artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  verify_public:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Verify exact public origin and provenance
        run: node scripts/verify-public-release.mjs
        env:
          FMC_PUBLIC_ROOT: ${{ needs.deploy.outputs.page_url }}
          FMC_SOURCE_REVISION: ${{ github.sha }}

  publish_release:
    needs: verify_public
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Verify immutable tag target and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="p5-web-v0.1.0"
          release_ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$tag\") | .id")"
          test "$(sed '/^$/d' <<<"$release_ids" | wc -l)" -eq 1
          release_id="$release_ids"
          tag_revision="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/p5-web-v0.1.0" --jq '.object.sha')"
          test "$tag_revision" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.draft')" = "true"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            -f make_latest=true >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.draft')" = "false"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/p5-web-v0.1.0" --jq '.object.sha')" = "$GITHUB_SHA"
